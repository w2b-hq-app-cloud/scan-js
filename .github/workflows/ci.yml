name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Link check
        run: node scripts/check-scan-link.mjs
      - name: Smoke validate
        run: node scripts/scan-smoke.mjs
