name: Bug report
description: Report a bug in SCAN packages, CLI, or whiteboard
labels: [bug]
body:
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: Node version, OS, browser if UI
